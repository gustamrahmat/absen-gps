<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            padding: 20px 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        #map {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            background: #e5e7eb;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            color: #4b5563;
            margin-top: 8px;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-target { background: #dc2626; }
        .dot-user { background: #2563eb; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:active {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
        }
        #liveJarak {
            margin-top: 8px;
            font-size: 13px;
            color: #374151;
        }
        /* --- CSS NOTIFIKASI DISESUAIKAN --- */
        #zoneNotif {
            margin-top: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 10px;
            border-radius: 6px;
            display: none;
        }
        #zoneNotif.in-zone {
            display: block;
            background: #dcfce7;
            color: #16a34a;
        }
        #zoneNotif.out-zone {
            display: block;
            background: #fee2e2;
            color: #dc2626;
        }
        .success { color: #16a34a !important; font-weight: bold; }
        .error { color: #dc2626 !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Absensi</h2>
        <p>Peta di bawah menampilkan posisi Anda secara live. Anda harus berada di radius maksimal 2 meter dari titik lokasi untuk bisa absen.</p>

        <!-- NOTIFIKASI DIPINDAH KE SINI (DI ATAS PETA) -->
        <div id="zoneNotif"></div>

        <div id="map"></div>
        <div class="legend">
            <span><span class="dot dot-target"></span> Titik Absen</span>
            <span><span class="dot dot-user"></span> Posisi Anda</span>
            <span><span class="dot" style="background:#f59e0b;opacity:0.5;"></span> Zona Absen</span>
        </div>
        <div id="liveJarak">Jarak: -</div>

        <button id="btnAbsen" onclick="prosesAbsen()" disabled>Mencari lokasi...</button>

        <div id="status">Status: Belum absen</div>
    </div>

    <script>
        // === PENGATURAN LOKASI KANTOR/SEKOLAH ===
        const TARGET_LAT = -7.5051801; 
        const TARGET_LNG = 110.2253764; 
        const MAX_RADIUS = 2; 
        const ZONE_RADIUS = 5; 

        const statusDiv = document.getElementById('status');
        const liveJarakDiv = document.getElementById('liveJarak');
        const zoneNotifDiv = document.getElementById('zoneNotif');
        const btnAbsen = document.getElementById('btnAbsen');

        let userLat = null;
        let userLng = null;
        let watchId = null;
        let sedangDiDalamZona = null; 

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        function kirimNotifikasiSistem(judul, isi) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(judul, { body: isi, icon: '' });
            }
        }

        // === SETUP PETA ===
        const map = L.map('map').setView([TARGET_LAT, TARGET_LNG], 18);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const targetIcon = L.divIcon({
            className: '',
            html: '<div style="width:16px;height:16px;background:#dc2626;border:2px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
        L.marker([TARGET_LAT, TARGET_LNG], { icon: targetIcon }).addTo(map)
            .bindPopup('Titik Absen');

        const radiusCircle = L.circle([TARGET_LAT, TARGET_LNG], {
            radius: MAX_RADIUS,
            color: '#dc2626',
            fillColor: '#dc2626',
            fillOpacity: 0.15,
            weight: 1
        }).addTo(map);

        const zoneCircle = L.circle([TARGET_LAT, TARGET_LNG], {
            radius: ZONE_RADIUS,
            color: '#f59e0b',
            fillColor: '#f59e0b',
            fillOpacity: 0.08,
            weight: 1,
            dashArray: '6, 6'
        }).addTo(map).bindPopup('Zona Absen (' + ZONE_RADIUS + 'm)');

        const userIcon = L.divIcon({
            className: '',
            html: '<div style="width:16px;height:16px;background:#2563eb;border:2px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
        let userMarker = null;
        let userAccCircle = null;
        let posSebelumnya = null; 
        let animasiFrameId = null;

        function animasikanMarker(dariLat, dariLng, keLat, keLng, durasiMs) {
            if (animasiFrameId) cancelAnimationFrame(animasiFrameId);
            const mulai = performance.now();

            function frame(waktuSekarang) {
                const progress = Math.min((waktuSekarang - mulai) / durasiMs, 1);
                const eased = 1 - Math.pow(1 - progress, 2);
                const lat = dariLat + (keLat - dariLat) * eased;
                const lng = dariLng + (keLng - dariLng) * eased;
                userMarker.setLatLng([lat, lng]);
                if (userAccCircle) userAccCircle.setLatLng([lat, lng]);

                if (progress < 1) {
                    animasiFrameId = requestAnimationFrame(frame);
                }
            }
            animasiFrameId = requestAnimationFrame(frame);
        }

        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function mulaiLiveTracking() {
            if (!navigator.geolocation) {
                statusDiv.innerHTML = "<span class='error'>Error: Browser Anda tidak mendukung GPS.</span>";
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    const akurasi = position.coords.accuracy;

                    if (!userMarker) {
                        userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map)
                            .bindPopup('Posisi Anda');
                        userAccCircle = L.circle([userLat, userLng], {
                            radius: akurasi,
                            color: '#2563eb',
                            fillColor: '#2563eb',
                            fillOpacity: 0.08,
                            weight: 1
                        }).addTo(map);
                        posSebelumnya = { lat: userLat, lng: userLng };
                        map.fitBounds([[TARGET_LAT, TARGET_LNG], [userLat, userLng]], { padding: [30, 30] });
                    } else {
                        animasikanMarker(posSebelumnya.lat, posSebelumnya.lng, userLat, userLng, 700);
                        userAccCircle.setRadius(akurasi);
                        posSebelumnya = { lat: userLat, lng: userLng };
                    }

                    const jarak = hitungJarak(TARGET_LAT, TARGET_LNG, userLat, userLng);
                    liveJarakDiv.innerHTML = `Jarak Anda ke titik absen: <b>${jarak.toFixed(2)} meter</b> (akurasi GPS: ${akurasi.toFixed(1)}m)`;

                    const diDalamZonaSekarang = jarak <= ZONE_RADIUS;

                    if (sedangDiDalamZona === null) {
                        sedangDiDalamZona = diDalamZonaSekarang;
                        if (diDalamZonaSekarang) {
                            zoneNotifDiv.className = 'in-zone';
                            zoneNotifDiv.textContent = 'Kamu berada di dalam zona absen';
                        } else {
                            zoneNotifDiv.className = 'out-zone';
                            zoneNotifDiv.textContent = 'Kamu berada di luar zona absen';
                        }
                    } else if (diDalamZonaSekarang && !sedangDiDalamZona) {
                        sedangDiDalamZona = true;
                        zoneNotifDiv.className = 'in-zone';
                        zoneNotifDiv.textContent = 'Kamu berada di dalam zona absen';
                        kirimNotifikasiSistem('Absen GPS', 'Kamu berada di dalam zona absen');
                    } else if (!diDalamZonaSekarang && sedangDiDalamZona) {
                        sedangDiDalamZona = false;
                        zoneNotifDiv.className = 'out-zone';
                        zoneNotifDiv.textContent = 'Kamu keluar dari zona absen';
                        kirimNotifikasiSistem('Absen GPS', 'Kamu keluar dari zona absen');
                    }

                    btnAbsen.disabled = false;
                    btnAbsen.textContent = 'Absen Sekarang';
                },
                function(error) {
                    btnAbsen.textContent = 'Absen Sekarang';
                    btnAbsen.disabled = false;
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            statusDiv.innerHTML = "<span class='error'>Izin lokasi ditolak. Aktifkan GPS dan izinkan browser mengakses lokasi.</span>";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            statusDiv.innerHTML = "<span class='error'>Informasi lokasi tidak tersedia.</span>";
                            break;
                        case error.TIMEOUT:
                            statusDiv.innerHTML = "<span class='error'>Waktu permintaan lokasi habis. Coba lagi.</span>";
                            break;
                        default:
                            statusDiv.innerHTML = "<span class='error'>Terjadi kesalahan yang tidak diketahui.</span>";
                            break;
                    }
                },
                {
                    enableHighAccuracy: true, 
                    timeout: 5000,     
                    maximumAge: 1000   
                }
            );
        }

        function prosesAbsen() {
            if (userLat === null || userLng === null) {
                statusDiv.innerHTML = "<span class='error'>Lokasi belum ditemukan, mohon tunggu sebentar.</span>";
                return;
            }
            const jarak = hitungJarak(TARGET_LAT, TARGET_LNG, userLat, userLng);
            if (jarak <= MAX_RADIUS) {
                statusDiv.innerHTML = `<span class='success'>Berhasil Absen!</span><br>Jarak Anda: ${jarak.toFixed(2)} meter.`;
            } else {
                statusDiv.innerHTML = `<span class='error'>Gagal Absen.</span><br>Jarak Anda ${jarak.toFixed(2)} meter dari target (Maks: ${MAX_RADIUS}m).`;
            }
        }

        mulaiLiveTracking();
    </script>
</body>
</html>
