<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator QR Absen</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            background: #f3f4f6;
            margin: 0;
            padding: 30px 0;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 90%;
            text-align: center;
        }
        h2 { margin-top: 0; }
        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #4b5563;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 9px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
        }
        button.secondary {
            background: #6b7280;
        }
        #qrOutput {
            margin-top: 18px;
            display: flex;
            justify-content: center;
        }
        p.info {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Generator QR Titik Absen</h2>
        <p class="info">Buat QR sekali untuk tiap titik lokasi (misal: Pos Security), lalu cetak dan tempel di lokasi tersebut.</p>

        <label>Nama Lokasi</label>
        <input id="inNama" value="Pos Security" />

        <label>Latitude</label>
        <input id="inLat" value="-7.5051801" />

        <label>Longitude</label>
        <input id="inLng" value="110.2253764" />

        <label>Radius Zona Absen (meter)</label>
        <input id="inRadius" type="number" value="5" />

        <button onclick="buatQR()">Buat QR Code</button>

        <div id="qrOutput"></div>

        <button class="secondary" id="btnUnduh" style="display:none;" onclick="unduhQR()">Unduh Gambar QR (PNG)</button>
    </div>

    <script>
        function buatQR() {
            const data = {
                lat: parseFloat(document.getElementById('inLat').value),
                lng: parseFloat(document.getElementById('inLng').value),
                radius: parseFloat(document.getElementById('inRadius').value),
                nama: document.getElementById('inNama').value.trim()
            };

            if (isNaN(data.lat) || isNaN(data.lng) || isNaN(data.radius)) {
                alert('Latitude, Longitude, dan Radius harus berupa angka.');
                return;
            }

            document.getElementById('qrOutput').innerHTML = '';
            new QRCode(document.getElementById('qrOutput'), {
                text: JSON.stringify(data),
                width: 260,
                height: 260,
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('btnUnduh').style.display = 'block';
        }

        function unduhQR() {
            const el = document.querySelector('#qrOutput img') || document.querySelector('#qrOutput canvas');
            if (!el) return;
            const link = document.createElement('a');
            link.download = 'qr-absen.png';
            link.href = el.tagName === 'CANVAS' ? el.toDataURL('image/png') : el.src;
            link.click();
        }

        // Buat contoh QR otomatis saat halaman dibuka
        buatQR();
    </script>
</body>
</html>
